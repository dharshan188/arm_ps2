<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sorti — AI waste assistant</title>
  <link rel="stylesheet" href="/static/sorti.css">
  <script src="/static/sorti.js" defer></script>
</head>
<!-- Sorti v4 frontend: docs/design/UI_DESIGN_SYSTEM.md "Industrial Vision Dark Mode" + docs/design/ui_layout_mockup.html layout, fully offline, live /api/state. -->
<body data-status="loading">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M7.2 9.6 9.9 5a2.4 2.4 0 0 1 4.2 0l1.1 1.9M16.9 9.4l2.7 4.7a2.4 2.4 0 0 1-2.1 3.6h-2.6M10.6 17.7H6.5a2.4 2.4 0 0 1-2.1-3.6l1.2-2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m13.6 4.3 1.6 2.6-3 .2M20.2 12l-.6 3-2.6-1.6M8.7 20l-2.2-2.3 2.6-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="3.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bin" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19l7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4L12 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.2h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5L8 5.5Z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="top">
    <div class="brand">
      <div class="mark"><svg><use href="#i-recycle"/></svg></div>
      <div class="brand-txt">
        <span class="brand-name">Sorti<i></i></span>
        <span class="brand-sub">AI WASTE ASSISTANT</span>
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="status"><i></i><span id="status-text">Starting…</span></span>
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="hi" lang="hi">हिंदी</button>
        <button type="button" data-lang="ta" lang="ta">தமிழ்</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <!-- LEFT: live camera + detection card -->
    <section class="panel cam">
      <div class="strip">
        <div class="strip-l">
          <span class="dot" id="cam-dot"></span>
          <span class="mono hi" id="cam-state">Camera connecting</span>
          <span class="sep">•</span>
          <span class="mono" id="cam-meta">— FPS</span>
        </div>
        <span class="mono caps" id="cam-live">LIVE STREAM</span>
      </div>
      <div class="viewport" id="viewport">
        <img id="feed" alt="Live camera with detected waste items" src="/video">
        <div class="cam-off" id="cam-off">Starting camera…</div>
        <!-- educational video plays over the camera -->
        <div class="edu" id="edu" hidden>
          <video id="edu-video" muted playsinline preload="auto"></video>
          <div class="edu-bar">
            <div class="edu-txt">
              <span class="caps mono edu-k"><svg><use href="#i-play"/></svg><span id="edu-kicker">Learn more</span></span>
              <span class="edu-title" id="edu-title"></span>
            </div>
            <button type="button" class="btn-sub" id="edu-skip">Skip</button>
          </div>
          <div class="edu-cap" id="edu-cap" hidden></div>
          <div class="edu-prog"><i id="edu-prog"></i></div>
          <span class="edu-credit mono" id="edu-credit"></span>
        </div>
      </div>
      <div class="detect" id="detect">
        <div class="det-empty" id="det-empty">
          <div class="det-ic"><svg><use href="#i-recycle"/></svg></div>
          <div>
            <div class="det-title" id="det-empty-title">Show your waste to the camera</div>
            <div class="det-sub" id="det-empty-sub">Sorti finds every item and tells you its bin.</div>
          </div>
        </div>
        <ul class="det-list" id="det-list"></ul>
      </div>
    </section>

    <!-- RIGHT: Sorti assistant -->
    <section class="panel chat">
      <div class="chat-head">
        <div class="chat-id">
          <div class="bot"><svg><use href="#i-bot"/></svg></div>
          <div>
            <div class="chat-name">Sorti Assistant</div>
            <div class="chat-state mono" id="asst-state"><i></i><span>Active</span></div>
          </div>
        </div>
        <button type="button" class="icon-btn" id="restart" title="Start over"><svg><use href="#i-restart"/></svg></button>
      </div>
      <ol class="msgs" id="msgs" aria-live="polite"></ol>
      <div class="pills" id="pills"></div>
      <div class="composer">
        <form class="ask" id="ask-form" autocomplete="off">
          <span class="mic" id="mic" role="status" aria-label="Microphone (use the button on the mic)">
            <svg class="i-mic"><use href="#i-mic"/></svg>
            <span class="level" id="level"></span>
          </span>
          <input id="q" type="text" placeholder="Ask Sorti about disposal, materials or rules…" aria-label="Type a question">
          <button type="submit" class="send" title="Send"><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="foot mono">
          <span id="hint">Press the button on the mic and ask — English, हिंदी or தமிழ்</span>
          <span id="sys"></span>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>
</body>
</html>
